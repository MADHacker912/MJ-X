plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mjx.assistant'
    compileSdk 34

    defaultConfig {
        applicationId "com.mjx.assistant"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Zero unnecessary third-party dependencies - standard Android platform capabilities
}
